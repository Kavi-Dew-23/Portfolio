name: Portfolio Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v3

      - name: Debug 
        run: pwd && ls -a

      - name: Build Docker image
        run: docker build -t portfolio:latest .
      
      - name: Deploy (local WSL) the container
        run: |      
          docker stop portfolio_c1 || true
          docker rm portfolio_c1 || true
          docker run -d --restart always --name portfolio_c1 -p 4000:80 portfolio:latest